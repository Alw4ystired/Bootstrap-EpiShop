<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpiShop — E-commerce</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <header class="bg-primary text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="fs-3 m-0">EpiShop</h1>
      <nav class="d-flex">
        <a href="#" class="text-white text-decoration-none mx-2">Prodotti</a>
        <a href="#" class="text-white text-decoration-none mx-2">Offerte</a>
        <a href="#" class="text-white text-decoration-none mx-2 d-none d-md-block">Contatti</a>
      </nav>
    </div>
  </header>
  

  <section>
    <hero class="bg-light py-5">
      <div class="container text-center">

      </div>
    </hero>
    <section class="bg-light py-5">
    <div class="container text-center">
      <h2 class="fs-1 fw-bold mb-3">Saldi di primavera</h2>
      <p class="fs-5 text-muted mb-4">Scopri le offerte sui prodotti in evidenza, fino al 50% di sconto.</p>
      <a href="#" class="d-inline-block bg-primary text-white text-decoration-none py-2 px-4 rounded">Vedi i prodotti</a>
    </div>
  </section>
    
  <main class="container my-4">
    <div class="row">

      <aside>
        <!-- Sidebar categorie. Visibile solo da lg in su (d-none d-lg-block) -->
      </aside>

      <section>
        <!-- Griglia prodotti responsive (1 / 2 / 3 / 4 per riga in base al breakpoint) -->
      </section>

    </div>
  </main>

  <footer>
    <!-- Footer scuro centrato con copyright -->
  </footer>

</body>

</html>
