<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpiShop — E-commerce</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" type="text/css" href="assets/css/style.css">
</head>

<body>

  <nav class="navbar navbar-expand-md bg-primary navbar-dark py-3">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3" href="#">EpiShop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav-menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Prodotti</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Offerte</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contatti</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Account</a></li>
        </ul>

     <!-- Bottone tema scuro -->
        <button id="toggle-tema" type="button" class="btn btn-outline-light ms-md-2 mt-2 mt-md-0">Tema scuro</button>
      </div>
    </div>
  </nav>

  <!-- Carosello (Vuoto: verrà popolato da JS) -->
  <div id="hero" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-inner" id="carousel-container"></div>

    <button class="carousel-control-prev" type="button" data-bs-target="#hero" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#hero" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
    </button>
  </div>

  <main class="container my-4">
    <!-- Alert -->
    <div class="alert alert-info alert-dismissible fade show" role="alert">
      Spedizione GRATIS oltre i 50 €.
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Chiudi"></button>
    </div>

    <div class="row">
      <!-- Sidebar Categorie, modifiche fatte per tema scuro -->
      <aside class="col-lg-3 d-none d-lg-block">
        <!-- Uso "card shadow-sm" per avere lo stesso sfondo, bordo e ombra delle card -->
        <div class="card shadow-sm p-3">
          <!-- card-title: stesso colore del titolo dei prodotti -->
          <h3 class="card-title fs-5 fw-bold mb-3">Categorie</h3>
          <!-- card-text text-muted: stesso colore grigio della descrizione dei prodotti -->
          <p class="card-text text-muted m-0 mb-2">Abbigliamento</p>
          <p class="card-text text-muted m-0 mb-2">Scarpe</p>
          <p class="card-text text-muted m-0 mb-2">Accessori</p>
          <p class="card-text text-muted m-0 mb-2">Borse</p>
        </div>
      </aside>

      <section class="col-12 col-lg-9">
        <h2 class="fs-3 fw-bold mb-4 text-center text-md-start">
          Prodotti in evidenza &nbsp; <span class="badge bg-danger fs-6">-30%</span>
        </h2>

        <!-- Griglia Prodotti -->
        <div class="row" id="products-container"></div>
      </section>
    </div>
  </main>

  <!-- Contenitore Modali -->
  <div id="modals-container"></div>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
      <p class="m-0">©2026 EpiShop - tutti i diritti riservati</p>
    </div>
  </footer>

  <!-- Script Bootstrap Bundle PRIMA del mio JS  -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Mio script JS -->
  <script src="assets/js/script.js"></script>
</body>

</html>
